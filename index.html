<style>
:root {
  color-scheme: dark;
  --bg: #060d16;
  --ink: #e8f1f7;
  --dim: #8aa2b8;
  --ion: #ff4da6;
  --gold: #f2b544;
  --line: #1c2a38;
  --panel: rgba(9, 20, 33, 0.94);
  --cyan: #7fe3ff;
  --u: 1;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

.app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 16px; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.bar h1 { font-family: "Orbitron", "Segoe UI", Arial, sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 0.06em; margin: 0; }
.bar .li { color: var(--ion); }
.bar p { margin: 0; font-size: 12px; color: var(--dim); }
.bar select { font: inherit; font-size: 12px; background: #0d1a28; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.screen { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 20px 60px -20px rgba(255, 77, 166, 0.25); }
canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.help { margin: 0; font-size: 12px; color: var(--dim); text-align: center; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink); font: inherit; }

.hudbtns { position: absolute; top: calc(var(--u) * 30px); right: calc(var(--u) * 24px); display: flex; gap: calc(var(--u) * 6px); z-index: 3; }
.hudbtns button { width: calc(var(--u) * 32px); height: calc(var(--u) * 32px); border-radius: 8px; border: 0; background: rgba(255,255,255,0.1); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.hudbtns button:hover { background: rgba(255,255,255,0.18); }
.hudbtns svg { width: 60%; height: 60%; }

.overlay {
  position: absolute; inset: 0; z-index: 2;
  font-size: calc(var(--u) * 13px);
  overflow-y: auto; overscroll-behavior: contain;
  padding: 2.6em 2.2em 1.6em;
  background: rgba(5, 12, 20, 0.72);
  display: flex; flex-direction: column; gap: 0.9em;
  animation: fadein 0.3s ease both;
}
.overlay > * { flex-shrink: 0; }
.overlay.center { justify-content: center; }
.overlay.late { animation-delay: 0.35s; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .overlay { animation: none; } }
.overlay h2, .overlay h3 { font-family: "Orbitron", "Segoe UI", Arial, sans-serif; margin: 0; text-wrap: balance; }
.overlay h2 { font-size: 1.5em; letter-spacing: 0.03em; }
.overlay h3 { font-size: 0.95em; letter-spacing: 0.05em; color: var(--gold); }
.overlay p { margin: 0; line-height: 1.5; }
.muted { color: var(--dim); }
.logo { font-family: "Orbitron", "Segoe UI", Arial, sans-serif; font-weight: 900; text-align: center; line-height: 1; }
.logo span { display: block; font-size: 2.6em; letter-spacing: 0.08em; }
.logo b { display: block; font-size: 3.3em; color: var(--ion); }
.tag { text-align: center; color: var(--dim); }
.stack { display: flex; flex-direction: column; gap: 0.55em; }
.row { display: flex; gap: 0.5em; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; }
.btn {
  font: inherit; font-family: "Orbitron", "Segoe UI", Arial, sans-serif; font-weight: 700; font-size: 0.95em;
  color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 10px; padding: 0.75em 0.9em; cursor: pointer; letter-spacing: 0.03em;
  display: flex; flex-direction: column; align-items: center; gap: 0.2em; min-width: 0;
}
.btn:hover { background: rgba(255,255,255,0.14); }
.btn:focus-visible, .overlay input:focus-visible, .hudbtns button:focus-visible, .toggle input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn.primary { background: var(--ion); border-color: var(--ion); color: #fff; font-size: 1.1em; }
.btn.primary:hover { background: #ff66b3; }
.btn.small { font-size: 0.8em; padding: 0.6em 0.5em; }
.btn small { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 0.78em; color: var(--dim); letter-spacing: 0; }
.btn.primary small { color: #ffe0ef; }
.toggle { display: flex; gap: 0.7em; align-items: flex-start; cursor: pointer; padding: 0.6em 0.7em; border-radius: 10px; background: rgba(255,255,255,0.04); }
.toggle input { margin-top: 0.2em; accent-color: var(--ion); width: 1.1em; height: 1.1em; flex: none; }
.toggle span { display: flex; flex-direction: column; gap: 0.15em; }
.toggle small { color: var(--dim); font-size: 0.85em; }
.route { display: flex; flex-wrap: wrap; gap: 0.35em; align-items: center; justify-content: center; font-size: 0.85em; }
.chip { padding: 0.25em 0.6em; border-radius: 99px; border: 1px solid currentColor; opacity: 0.45; }
.chip.on { opacity: 1; }
.arrow { color: var(--dim); }
.rec { text-align: center; color: var(--gold); font-weight: 600; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5em; text-align: center; }
.scores b { display: block; font-family: "Orbitron", sans-serif; font-size: 2.3em; font-variant-numeric: tabular-nums; }
.scores span { font-size: 0.75em; letter-spacing: 0.1em; color: var(--dim); }
.gold { color: var(--gold); }
.badges { display: flex; gap: 0.5em; justify-content: center; flex-wrap: wrap; }
.badge { font-family: "Orbitron", sans-serif; font-size: 0.75em; font-weight: 700; padding: 0.35em 0.8em; border-radius: 99px; background: var(--gold); color: #1a1204; }
.badge.medal { background: transparent; border: 1px solid currentColor; }
.stats { text-align: center; color: var(--dim); font-size: 0.9em; font-variant-numeric: tabular-nums; }
.fact { background: rgba(242,181,68,0.08); border: 1px solid rgba(242,181,68,0.25); border-radius: 10px; padding: 0.8em 0.9em; display: flex; flex-direction: column; gap: 0.35em; }
.fact p { font-size: 0.92em; }
ol.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.25em; font-variant-numeric: tabular-nums; }
ol.rank li { display: grid; grid-template-columns: 2em 1fr auto; gap: 0.5em; padding: 0.45em 0.6em; border-radius: 6px; background: rgba(255,255,255,0.04); }
ol.rank li:first-child { color: var(--gold); }
ol.rank li.me { outline: 1px solid var(--ion); }
ol.rank b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ol.rank .bar { display: block; height: 0.55em; margin-top: 0.35em; border-radius: 99px; background: var(--ion); opacity: 0.7; }
ol.rank em { font-style: normal; font-weight: 600; }
.legend { display: grid; grid-template-columns: 2.2em 1fr; gap: 0.55em 0.7em; align-items: center; font-size: 0.92em; }
.ico { width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.72em; color: #0a1624; }
.ico.hex { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); border-radius: 0; }
.diagram { width: 100%; height: auto; display: block; background: rgba(255,255,255,0.03); border-radius: 10px; }
.eq { font-size: 0.88em; display: grid; gap: 0.3em; background: rgba(255,255,255,0.04); padding: 0.7em 0.8em; border-radius: 8px; }
.eq b { color: var(--dim); font-weight: 500; }
.map { width: 100%; border-collapse: collapse; font-size: 0.85em; }
.map th { text-align: left; color: var(--dim); font-weight: 500; padding: 0.3em 0.4em; border-bottom: 1px solid var(--line); }
.map td { padding: 0.45em 0.4em; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.4; }
.map td:first-child { white-space: nowrap; color: var(--ink); font-weight: 600; }
.toast { position: absolute; left: 50%; bottom: calc(var(--u) * 34px); transform: translateX(-50%); z-index: 4; background: var(--ink); color: #0a1624; padding: 0.5em 0.9em; border-radius: 8px; font-size: calc(var(--u) * 12px); max-width: 85%; text-align: center; }
.hint { text-align: center; color: var(--dim); font-size: 0.85em; }
</style>
</head>

  lco: ["LiₓC₆ → C₆ + x Li⁺ + x e⁻", "Li₁₋ₓCoO₂ + x Li⁺ + x e⁻ → LiCoO₂"],

// ---------------- Utilidades ----------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* sin almacenamiento */ } }
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFrom(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const todayUTC = () => new Date().toISOString().slice(0, 10);

let lang = load(KEYS.lang, null) || ((navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en");
if (!I18N[lang]) lang = "es";
function t(key, vars) {
  let s = I18N[lang][key];
  if (s == null) s = I18N.es[key];
  if (typeof s !== "string") return s;
  if (vars) for (const k in vars) s = s.split(`{${k}}`).join(vars[k]);
  return s;
}
const fmtDate = (d) => { const [y, m, dd] = d.split("-"); return lang === "es" ? `${dd}/${m}/${y}` : `${y}-${m}-${dd}`; };
const levelName = (L) => (L.id === "ssb" ? t("ssb") : L.cathode);

// ---------------- Sonido ----------------
const audio = (() => {
  let ac = null;
  let muted = !!load(KEYS.muted, false);
  const ensure = () => {
    try {
      if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
      if (ac && ac.state === "suspended") ac.resume();
    } catch { ac = null; }
  };
  const tone = (f, dur, type = "sine", vol = 0.12, slide = null, delay = 0) => {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  };
  return {
    ensure,
    get muted() { return muted; },
    toggle() { muted = !muted; store(KEYS.muted, muted); },
    flap: () => tone(380, 0.11, "triangle", 0.1, 720),
    score: () => { tone(660, 0.07, "sine", 0.1); tone(990, 0.1, "sine", 0.1, null, 0.06); },
    phase: () => { tone(523, 0.1, "triangle", 0.12); tone(659, 0.1, "triangle", 0.12, null, 0.09); tone(784, 0.2, "triangle", 0.12, null, 0.18); },
    level: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, "triangle", 0.12, null, i * 0.09)); },
    electron: () => tone(1320, 0.07, "square", 0.05, 1900),
    power: () => { tone(440, 0.12, "sine", 0.12, 880); tone(880, 0.15, "sine", 0.08, 1320, 0.1); },
    shield: () => tone(200, 0.25, "square", 0.08, 90),
    die: () => { tone(320, 0.5, "sawtooth", 0.12, 55); tone(90, 0.35, "square", 0.06, 40, 0.05); },
  };
})();

// ---------------- DOM ----------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const screenEl = document.getElementById("screen");
const overlay = document.getElementById("overlay");
const toastEl = document.getElementById("toast");
const btnPause = document.getElementById("btnPause");
const btnMute = document.getElementById("btnMute");
const langSel = document.getElementById("lang");

let scale = 1, dpr = 1;
function resize() {
  const parent = screenEl.parentElement;
  const availW = parent.clientWidth, availH = parent.clientHeight || window.innerHeight;
  scale = Math.max(0.5, Math.min(availW / W, availH / H));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  screenEl.style.width = cw + "px"; screenEl.style.height = ch + "px";
  screenEl.style.setProperty("--u", scale.toFixed(3));
  canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
  canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(ch * dpr);
}
new ResizeObserver(resize).observe(screenEl.parentElement);
resize();

// ---------------- Estado ----------------
let state = "menu";      // menu | play | paused | dead
let ui = "menu";         // pantalla del overlay
let mode = "normal";     // normal | daily
let rng = Math.random;
let time = 0, wtime = 0, deadAt = 0, last = 0;
let ion, mems, items, dendrites, bubbles, particles, floaters;
let levelIdx, phase, phaseCount, passedTotal, phasesDone, score, collected, speed;
let lastGapY, lastAmp, spawnDist, slot, trans, banner, fx, wide, shake, flash, ionSX, grainOff;
let lastRun = null, currentFact = null;
let record = Number(load(KEYS.record, 0)) || 0;
let history = load(KEYS.scores, []); if (!Array.isArray(history)) history = [];
let maxLevel = Number(load(KEYS.maxLevel, 0)) || 0;
let teacher = !!load(KEYS.teacher, false);

const lvl = () => LEVELS[Math.min(levelIdx, LEVELS.length - 1)];
const extra = () => Math.max(0, levelIdx - (LEVELS.length - 1));
const dir = () => (phase === "discharge" ? 1 : -1);
const computeSpeed = () => lvl().speed + extra() * 12 + phaseCount * 2.2 + (phase === "charge" ? 8 : 0);

function dailyBest() {
  const d = load(KEYS.daily, null);
  return d && d.date === todayUTC() ? d.best : 0;
}

function reset() {
  ion = { y: H / 2, vy: 0, squash: 0 };
  mems = []; items = []; dendrites = []; bubbles = []; particles = []; floaters = [];
  levelIdx = 0; phase = "discharge"; phaseCount = 0; passedTotal = 0; phasesDone = 0;
  score = 0; collected = 0;
  lastGapY = H / 2; lastAmp = 0; spawnDist = SPACING - 90; slot = 0;
  trans = 0; banner = null; fx = { fec: 0, slow: 0, shield: false, inv: 0 }; wide = 1;
  shake = 0; flash = 0; ionSX = ION_X; grainOff = 0; wtime = 0;
  speed = computeSpeed();
}
reset();

// Fondo: aniones PF₆⁻ del electrolito líquido
const anions = Array.from({ length: 22 }, () => ({ x: rand(0, W), y: rand(CASING + 10, H - CASING - 10), r: rand(3, 7), depth: rand(0.15, 0.5) }));

// Texturas precalculadas
function makeTile(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d")); return ctx.createPattern(c, "repeat"); }
const porePattern = makeTile(12, 12, (p) => { p.fillStyle = "rgba(242,181,68,0.35)"; p.beginPath(); p.arc(3, 3, 1.3, 0, 7); p.arc(9, 9, 1.3, 0, 7); p.fill(); });
const grainPattern = makeTile(90, 90, (p) => {
  const r = mulberry32(7);
  for (let i = 0; i < 14; i++) {
    const cx = r() * 90, cy = r() * 90, rad = 8 + r() * 10, n = 5 + Math.floor(r() * 3);
    p.beginPath();
    for (let k = 0; k < n; k++) { const a = (k / n) * Math.PI * 2 + r() * 0.4; const rr = rad * (0.75 + r() * 0.3); p[k ? "lineTo" : "moveTo"](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    p.closePath();
    p.fillStyle = `rgba(232,201,160,${0.04 + r() * 0.05})`; p.fill();
    p.strokeStyle = "rgba(232,201,160,0.12)"; p.stroke();
  }
});

// ---------------- Generación de nivel ----------------
function spawn() {
  const L = lvl(), ex = extra(), gd = dir();
  const gap = Math.max(L.gapMin - ex * 4, L.gap - phaseCount * 2.5 - ex * 4);
  const minC = CASING + gap / 2 + 24, maxC = H - CASING - gap / 2 - 24;
  const prevC = lastGapY, prevAmp = lastAmp;
  const c = clamp(prevC + (rng() * 2 - 1) * 170, minC, maxC);
  const movingP = Math.min(0.5, levelIdx * 0.1 + (phase === "charge" ? 0.12 : 0) + (phaseCount >= 5 ? 0.08 : 0));
  const moving = slot >= 2 && rng() < movingP;
  const amp = moving ? 28 + rng() * 27 : 0;
  mems.push({ x: W, c, base: c, gap, minC, maxC, moving, amp, ph: rng() * 6.283, counted: false });
  lastGapY = c; lastAmp = amp;

  if (slot >= 1) {
    const cx = W - (SPACING - MEM_W) / 2; // centro del pasillo entre la membrana anterior y esta
    const r = rng();
    let placed = false;
    if (slot >= 2 && r < L.dendrite) {
      // La dendrita nunca tapa el camino: su punta queda lejos de ambos huecos
      const allowed = gd > 0
        ? (H - CASING) - (Math.max(prevC + prevAmp, c + amp) + 50)
        : (Math.min(prevC - prevAmp, c - amp) - 50) - CASING;
      const h = Math.min(allowed, 60 + rng() * 150);
      if (h >= 40) {
        const branches = Array.from({ length: 3 + Math.floor(Math.random() * 3) }, () => ({ at: rand(0.2, 0.8), len: rand(10, 22), side: Math.random() < 0.5 ? -1 : 1 }));
        dendrites.push({ x: cx, maxH: h, h: 0, side: gd, branches });
        placed = true;
      }
    }
    const r2 = rng();
    if (!placed && r2 < 0.14) {
      const types = ["fec", "sei", "slow"];
      items.push({ kind: types[Math.floor(rng() * 3)], x: cx, y: clamp((prevC + c) / 2, CASING + 40, H - CASING - 40), bob: Math.random() * 6.28 });
    } else if (!placed && r2 < 0.6) {
      items.push({ kind: "e", x: cx, y: clamp((prevC + c) / 2 + (rng() * 2 - 1) * 55, CASING + 30, H - CASING - 30), bob: Math.random() * 6.28 });
    }
    if (!L.solid && rng() < L.bubble) {
      bubbles.push({ x: cx + (rng() * 2 - 1) * 30, y: H - CASING - 30 - rng() * 140, r: 14 + rng() * 14, rise: 25 + rng() * 25, co2: rng() < 0.5 });
    }
  }
  slot++;
}

// ---------------- Efectos ----------------
function burst(x, y, n, color, spd = 180) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), max: 0.9, r: rand(1.5, 3.5), color, grav: true });
  }
}
function floatText(text, x, y, color) { floaters.push({ text, x, y, color, life: 0.9 }); }

// ---------------- Lógica ----------------
function flap() { ion.vy = -JUMP * dir(); ion.squash = 1; audio.flap(); }

function startGame(m) {
  mode = m;
  rng = m === "daily" ? mulberry32(seedFrom("flappy-li:" + todayUTC())) : mulberry32((Math.random() * 2 ** 32) >>> 0);
  reset();
  state = "play"; ui = "none";
  banner = { title: t("discharge"), sub: t("dischargeSub"), t: 2 };
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  render();
  flap();
}

function useShield() {
  if (!fx.shield) return false;
  fx.shield = false; fx.inv = 1.2; shake = 6;
  burst(ionSX, ion.y, 22, POWER.sei.color, 200);
  audio.shield();
  return true;
}

function completePhase() {
  score += 50; phasesDone++;
  floatText("+50", ionSX, ion.y - 30, "#f2b544");
  if (phase === "discharge") {
    phase = "charge";
    banner = { title: t("charge"), sub: t("chargeSub"), t: 2.4 };
    audio.phase();
  } else {
    levelIdx++;
    phase = "discharge";
    if (levelIdx > maxLevel) { maxLevel = levelIdx; store(KEYS.maxLevel, Math.min(maxLevel, LEVELS.length - 1)); }
    const L = lvl();
    const lvName = levelName(L) + (extra() ? ` +${extra()}` : "");
    banner = { title: `${t("levelN", { n: levelIdx + 1 })} · ${lvName}`, sub: t("cycleDone", { n: levelIdx }), t: 2.6 };
    audio.level();
  }
  for (const m of mems) burst(m.x, m.c, 4, "#f2b544", 120);
  mems = []; items = []; dendrites = []; bubbles = [];
  phaseCount = 0; slot = 0; spawnDist = SPACING - 90; lastGapY = H / 2; lastAmp = 0;
  trans = 1.4; fx.inv = Math.max(fx.inv, 1.8);
  speed = computeSpeed();
}

function die(cause) {
  if (state !== "play") return;
  state = "dead"; deadAt = time;
  shake = 14; flash = 1;
  burst(ionSX, ion.y, 36, "#ff4da6", 260);
  audio.die();
  const L = lvl();
  let isNew = false;
  if (mode === "normal") {
    history.unshift(score); if (history.length > 10) history.length = 10; store(KEYS.scores, history);
    if (score > record) { record = score; isNew = score > 0; store(KEYS.record, record); }
  } else {
    const prev = dailyBest();
    if (score > prev) { isNew = score > 0; store(KEYS.daily, { date: todayUTC(), best: score }); }
  }
  lastRun = { score, pores: passedTotal, phases: phasesDone, cycles: levelIdx, levelIdx, level: L, cause, mode, date: todayUTC(), collected, isNew, phase };
  currentFact = pickFact(cause, L);
  ui = teacher ? "science" : "over";
  setTimeout(() => { if (state === "dead") render(); }, 350);
}

function pickFact(cause, L) {
  const pool = ["sep", "sei", "dendrite", "gas", "fec", "intercalation", "electrolyte", "cycle", "conductivity", L.id];
  const byCause = { membrane: ["sep", "sei"], dendrite: ["dendrite"], casing: ["electrolyte", "intercalation", "cycle"] }[cause] || pool;
  const list = Math.random() < 0.6 ? byCause : [L.id, ...pool];
  return list[Math.floor(Math.random() * list.length)];
}

function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function update(dt) {
  time += dt;
  const paused = state === "paused";
  const d = dir();
  const drift = state === "play" ? speed : 45;
  if (!paused) {
    for (const a of anions) {
      a.x -= drift * a.depth * dt * d;
      if (a.x < -10) { a.x = W + 10; a.y = rand(CASING + 10, H - CASING - 10); }
      if (a.x > W + 10) { a.x = -10; a.y = rand(CASING + 10, H - CASING - 10); }
    }
    grainOff += drift * 0.3 * dt * d;
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; if (p.grav) p.vy += 300 * dt; p.life -= dt; }
    particles = particles.filter((p) => p.life > 0);
    for (const f of floaters) { f.y -= 40 * dt; f.life -= dt; }
    floaters = floaters.filter((f) => f.life > 0);
    shake = Math.max(0, shake - 40 * dt);
    flash = Math.max(0, flash - 2.5 * dt);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  }

  if (state === "menu") { ion.y = H / 2 - 40 + Math.sin(time * 2.4) * 10; ionSX = ION_X; return; }
  if (state === "dead") {
    const lim = d > 0 ? H - CASING - ION_R : CASING + ION_R;
    ion.vy = clamp(ion.vy + FIELD * d * dt, -MAX_V, MAX_V);
    ion.y = d > 0 ? Math.min(ion.y + ion.vy * dt, lim) : Math.max(ion.y + ion.vy * dt, lim);
    return;
  }
  if (state !== "play") return;

  // temporizadores de potenciadores (tiempo real)
  fx.fec = Math.max(0, fx.fec - dt);
  fx.slow = Math.max(0, fx.slow - dt);
  fx.inv = Math.max(0, fx.inv - dt);
  wide += ((fx.fec > 0 ? 1.45 : 1) - wide) * Math.min(1, dt * 4);
  const wdt = dt * (fx.slow > 0 ? 0.6 : 1);
  wtime += wdt;

  const targetSX = d > 0 ? ION_X : W - ION_X;
  ionSX += (targetSX - ionSX) * Math.min(1, dt * (trans > 0 ? 3 : 12));
  ion.squash = Math.max(0, ion.squash - 5 * dt);

  if (trans > 0) {
    trans -= dt;
    ion.vy = 0;
    ion.y += (H / 2 - ion.y) * Math.min(1, dt * 3);
    return;
  }

  // campo: en descarga hacia abajo, en carga hacia arriba
  ion.vy = clamp(ion.vy + FIELD * d * wdt, -MAX_V, MAX_V);
  ion.y += ion.vy * wdt;

  if (Math.random() < 0.8) {
    particles.push({ x: ionSX - d * ION_R * 0.6, y: ion.y + rand(-4, 4), vx: -speed * 0.6 * d, vy: rand(-15, 15), life: 0.35, max: 0.35, r: rand(1.5, 3), color: "#ffa3cf" });
  }

  spawnDist += speed * wdt;
  if (spawnDist >= SPACING) { spawnDist -= SPACING; spawn(); }

  // burbujas de gas: empujan al ion
  for (const b of bubbles) {
    b.x -= speed * wdt; b.y -= b.rise * wdt;
    const dx = b.x - ION_X, dy = ion.y - b.y, dist = Math.hypot(dx, dy) || 1, range = b.r + ION_R + 26;
    if (dist < range) ion.vy += (dy / dist) * (1 - dist / range) * 2600 * wdt;
  }
  bubbles = bubbles.filter((b) => {
    const alive = b.x > -40 && b.y > CASING + b.r * 0.5;
    if (!alive && b.x > -40) burst(d > 0 ? b.x : W - b.x, b.y, 6, "rgba(220,240,255,0.8)", 80);
    return alive;
  });

  // carcasa
  if (ion.y - HIT_R < CASING || ion.y + HIT_R > H - CASING) {
    if (fx.inv > 0 || useShield()) {
      ion.y = clamp(ion.y, CASING + ION_R, H - CASING - ION_R);
      ion.vy = (ion.y < H / 2 ? 1 : -1) * 260;
    } else { ion.y = clamp(ion.y, CASING + ION_R, H - CASING - ION_R); die("casing"); return; }
  }

  // membranas del separador
  for (const m of mems) {
    m.x -= speed * wdt;
    if (m.moving) m.c = clamp(m.base + Math.sin(wtime * 1.7 + m.ph) * m.amp, m.minC, m.maxC);
  }
  while (mems.length && mems[0].x + MEM_W < -10) mems.shift();
  for (const m of mems) {
    const g = m.gap * wide, top = m.c - g / 2, bot = m.c + g / 2;
    if (fx.inv <= 0 && (circleRect(ION_X, ion.y, HIT_R, m.x, -50, MEM_W, top + 50) || circleRect(ION_X, ion.y, HIT_R, m.x, bot, MEM_W, H - bot + 50))) {
      if (!useShield()) { die("membrane"); return; }
    }
    if (!m.counted && m.x + MEM_W < ION_X - ION_R) {
      m.counted = true; passedTotal++; phaseCount++; score += 10;
      speed = computeSpeed();
      if (phaseCount >= PER_PHASE) { completePhase(); return; }
      audio.score();
    }
  }

  // dendritas
  for (const dd of dendrites) {
    dd.x -= speed * wdt;
    if (dd.x < W - 10 && dd.h < dd.maxH) dd.h = Math.min(dd.maxH, dd.h + dd.maxH * 1.4 * wdt);
    if (fx.inv > 0 || dd.h < 4) continue;
    const a = dd.side > 0 ? (H - CASING) - ion.y : ion.y - CASING;
    if (a < dd.h + HIT_R * 0.5 && a > -HIT_R) {
      const hw = 12 * (1 - clamp(a / dd.h, 0, 1));
      if (Math.abs(ION_X - dd.x) < hw + HIT_R * 0.75) { if (!useShield()) { die("dendrite"); return; } }
    }
  }
  dendrites = dendrites.filter((dd) => dd.x > -40);

  // objetos recogibles
  for (const it of items) {
    it.x -= speed * wdt;
    const y = it.y + Math.sin(wtime * 4 + it.bob) * 6;
    const dx = it.x - ION_X, dy = y - ion.y;
    if (dx * dx + dy * dy < (ION_R + 12) ** 2) {
      it.taken = true;
      const sx = d > 0 ? it.x : W - it.x;
      if (it.kind === "e") { score += 5; collected++; audio.electron(); burst(sx, y, 10, "#7fe3ff", 140); floatText("+5", sx, y - 14, "#7fe3ff"); }
      else {
        const P = POWER[it.kind];
        if (it.kind === "sei") fx.shield = true; else fx[it.kind] = P.dur;
        audio.power(); burst(sx, y, 18, P.color, 170); floatText(P.label, sx, y - 16, P.color);
      }
    }
  }
  items = items.filter((it) => !it.taken && it.x > -20);
}

// ---------------- Dibujo ----------------
const sxr = (x, w) => (dir() > 0 ? x : W - x - w);
const sxp = (x) => (dir() > 0 ? x : W - x);

function text(str, x, y, o = {}) {
  ctx.font = `${o.weight || "700"} ${o.size || 16}px ${o.font || FONT_D}`;
  ctx.fillStyle = o.color || "#e8f1f7";
  ctx.textAlign = o.align || "center";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(str, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function hexPath(x, y, r) { ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = (k / 6) * Math.PI * 2; ctx[k ? "lineTo" : "moveTo"](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }

function drawBackground() {
  const L = lvl();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.bg[0]); g.addColorStop(1, L.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (L.solid) {
    ctx.save(); ctx.translate(-(grainOff % 90), 0); ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, W + 90, H); ctx.restore();
  } else {
    ctx.strokeStyle = "rgba(120,170,220,0.32)"; ctx.lineWidth = 1.2;
    for (const a of anions) {
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(a.x - a.r * 0.45, a.y); ctx.lineTo(a.x + a.r * 0.45, a.y); ctx.stroke();
    }
  }
}

function drawCasing() {
  const off = ((time * (state === "play" ? speed : 45)) % 14) * dir();
  for (const y0 of [0, H - CASING]) {
    ctx.fillStyle = "#1b232c"; ctx.fillRect(0, y0, W, CASING);
    ctx.save(); ctx.beginPath(); ctx.rect(0, y0, W, CASING); ctx.clip();
    ctx.strokeStyle = "#2c3844"; ctx.lineWidth = 2;
    for (let x = -CASING - 14 - off; x < W + CASING + 14; x += 14) { ctx.beginPath(); ctx.moveTo(x, y0 + CASING); ctx.lineTo(x + CASING, y0); ctx.stroke(); }
    ctx.restore();
  }
  ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(0, CASING - 1, W, 1); ctx.fillRect(0, H - CASING, W, 1);
}

function drawElectrodes() {
  const L = lvl();
  const target = state === "play" ? (dir() > 0 ? "cathode" : "anode") : null;
  const pulse = 0.5 + 0.5 * Math.sin(time * 5);
  // ánodo
  ctx.fillStyle = L.solid ? "#8d99a6" : "#2b2f35";
  ctx.fillRect(0, CASING, ELECTRODE, H - CASING * 2);
  ctx.strokeStyle = L.solid ? "#b8c3ce" : "#4a525c"; ctx.lineWidth = 1;
  for (let y = CASING + 4; y < H - CASING; y += 6) { ctx.beginPath(); ctx.moveTo(2, y); ctx.lineTo(ELECTRODE - 2, y); ctx.stroke(); }
  // cátodo
  ctx.fillStyle = L.dark; ctx.fillRect(W - ELECTRODE, CASING, ELECTRODE, H - CASING * 2);
  ctx.fillStyle = L.color;
  for (let y = CASING + 5; y < H - CASING; y += 9) { ctx.beginPath(); ctx.arc(W - ELECTRODE / 2, y, 2, 0, 7); ctx.fill(); }
  if (target) {
    const x = target === "cathode" ? W - ELECTRODE : ELECTRODE;
    const gr = ctx.createLinearGradient(x, 0, x + (target === "cathode" ? -28 : 28), 0);
    gr.addColorStop(0, `rgba(255,77,166,${0.25 + pulse * 0.2})`); gr.addColorStop(1, "rgba(255,77,166,0)");
    ctx.fillStyle = gr; ctx.fillRect(target === "cathode" ? x - 28 : x, CASING, 28, H - CASING * 2);
  }
  ctx.save(); ctx.translate(ELECTRODE / 2 + 0.5, H / 2); ctx.rotate(-Math.PI / 2);
  text(`${t("anode")} · ${L.anode}`, 0, 0, { size: 9, color: L.solid ? "#10161c" : "#cfd6de", base: "middle", font: FONT_M, weight: "600" });
  ctx.restore();
  ctx.save(); ctx.translate(W - ELECTRODE / 2 - 0.5, H / 2); ctx.rotate(Math.PI / 2);
  text(`${t("cathode")} · ${L.cathode}`, 0, 0, { size: 9, color: "#f4f8ff", base: "middle", font: FONT_M, weight: "600" });
  ctx.restore();
}

function drawMembranes() {
  for (const m of mems) {
    const g = m.gap * wide, top = m.c - g / 2, bot = m.c + g / 2;
    const x = sxr(m.x, MEM_W);
    const edge = m.moving ? "#ff8a5c" : "#f2b544";
    for (const [y, h, lipY] of [[CASING - 4, top - CASING + 4, top], [bot, H - CASING - bot + 4, bot]]) {
      if (h <= 2) continue;
      ctx.fillStyle = m.moving ? "rgba(255,138,92,0.18)" : "rgba(242,181,68,0.2)";
      rr(x, y, MEM_W, h, 6); ctx.fill();
      ctx.save(); ctx.translate(x, 0); ctx.fillStyle = porePattern; rr(0, y, MEM_W, h, 6); ctx.fill(); ctx.restore();
      ctx.strokeStyle = m.moving ? "#ff8a5c" : "rgba(242,181,68,0.7)"; ctx.lineWidth = 1.5;
      rr(x + 0.75, y + 0.75, MEM_W - 1.5, h - 1.5, 6); ctx.stroke();
      ctx.fillStyle = edge; rr(x - 3, lipY - 4, MEM_W + 6, 8, 4); ctx.fill();
    }
    if (top - 14 > CASING + 6) text(m.moving ? "SEI" : "PE", x + MEM_W / 2, top - 12, { size: 10, font: FONT_M, color: m.moving ? "#ffb190" : "rgba(242,181,68,0.85)", weight: "600" });
    if (fx.fec > 0) { ctx.strokeStyle = "rgba(94,224,176,0.6)"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.strokeRect(x - 3, top, MEM_W + 6, bot - top); ctx.setLineDash([]); }
  }
}

function drawDendrites() {
  for (const d of dendrites) {
    if (d.h < 1) continue;
    const x = sxp(d.x);
    const root = d.side > 0 ? H - CASING : CASING;
    const tip = root - d.side * d.h;
    ctx.fillStyle = "#c9d3dc";
    ctx.beginPath(); ctx.moveTo(x - 12, root); ctx.lineTo(x, tip); ctx.lineTo(x + 12, root); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#c9d3dc"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    for (const b of d.branches) {
      const by = root - d.side * d.h * b.at;
      const hw = 12 * (1 - b.at);
      ctx.beginPath(); ctx.moveTo(x + b.side * hw * 0.5, by); ctx.lineTo(x + b.side * (hw + b.len * (1 - b.at)), by - d.side * b.len * 0.7); ctx.stroke();
    }
    ctx.lineCap = "butt";
    ctx.fillStyle = "rgba(255,255,255,0.65)";
    ctx.beginPath(); ctx.moveTo(x - 3, root); ctx.lineTo(x, tip + d.side * 6); ctx.lineTo(x - 0.5, root); ctx.closePath(); ctx.fill();
  }
}

function drawBubbles() {
  for (const b of bubbles) {
    const x = sxp(b.x);
    ctx.fillStyle = "rgba(200,230,255,0.08)"; ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(220,240,255,0.55)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.arc(x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.18, 0, 7); ctx.fill();
    text(b.co2 ? "CO₂" : "C₂H₄", x, b.y + 3.5, { size: 9, font: FONT_M, color: "rgba(220,240,255,0.75)", weight: "600" });
  }
}

function drawItems() {
  for (const it of items) {
    const x = sxp(it.x), y = it.y + Math.sin(wtime * 4 + it.bob) * 6;
    if (it.kind === "e") {
      const g = ctx.createRadialGradient(x, y, 2, x, y, 14);
      g.addColorStop(0, "rgba(127,227,255,0.55)"); g.addColorStop(1, "rgba(127,227,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fill();
      ctx.fillStyle = "#7fe3ff"; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
      text("e⁻", x, y + 0.5, { size: 9, color: "#06202b", base: "middle", font: FONT_M });
    } else {
      const P = POWER[it.kind];
      const g = ctx.createRadialGradient(x, y, 4, x, y, 24);
      g.addColorStop(0, P.color + "88"); g.addColorStop(1, P.color + "00");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 24, 0, 7); ctx.fill();
      ctx.fillStyle = P.color; hexPath(x, y, 13); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.2; hexPath(x, y, 13); ctx.stroke();
      text(P.label, x, y + 0.5, { size: 9, color: "#0a1624", base: "middle" });
    }
  }
}

function drawParticles() {
  for (const p of particles) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = clamp(f.life / 0.9, 0, 1); text(f.text, f.x, f.y, { size: 13, color: f.color }); }
  ctx.globalAlpha = 1;
}

function drawIon() {
  const x = ionSX, y = ion.y;
  if (fx.inv > 0 && state === "play" && trans <= 0 && Math.floor(time * 16) % 2) return;
  const tilt = state === "menu" ? 0 : clamp((ion.vy / 900) * dir(), -0.45, 0.8) * dir();
  const sq = ion.squash * 0.18;
  const halo = ctx.createRadialGradient(x, y, ION_R * 0.8, x, y, ION_R * 2.2);
  halo.addColorStop(0, "rgba(255,77,166,0.55)"); halo.addColorStop(1, "rgba(255,77,166,0)");
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, ION_R * 2.2, 0, 7); ctx.fill();
  if (fx.shield) {
    ctx.strokeStyle = POWER.sei.color; ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 6);
    hexPath(x, y, ION_R + 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(1 - sq, 1 + sq);
  const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, ION_R);
  g.addColorStop(0, "#ffa3cf"); g.addColorStop(1, "#ff4da6");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, ION_R, 0, 7); ctx.fill();
  text("Li⁺", 0, 1, { size: 11, color: "#fff", base: "middle" });
  ctx.restore();
}

function drawHUD() {
  const L = lvl(), x0 = ELECTRODE + 12;
  text(String(score), x0, CASING + 38, { size: 30, align: "left" });
  text(t("energy"), x0 + 1, CASING + 54, { size: 9, align: "left", color: "#8aa2b8", font: FONT_M, weight: "600" });
  const soc = phase === "discharge" ? 1 - phaseCount / PER_PHASE : phaseCount / PER_PHASE;
  const by = CASING + 64;
  ctx.strokeStyle = "#e8f1f7"; ctx.lineWidth = 1.5; rr(x0, by, 64, 16, 3); ctx.stroke();
  ctx.fillStyle = "#e8f1f7"; ctx.fillRect(x0 + 64, by + 5, 3, 6);
  ctx.fillStyle = soc > 0.7 ? "#6fdc8c" : soc > 0.3 ? "#f2b544" : "#ff4da6";
  ctx.fillRect(x0 + 3, by + 3, Math.max(0, 58 * soc), 10);
  const arrow = phase === "discharge" ? "▶" : "◀";
  text(`${phase === "discharge" ? t("discharge") : t("charge")} ${arrow} SOC ${Math.round(soc * 100)}%`, x0 + 74, by + 12, { size: 10, align: "left", font: FONT_M, color: "#e8f1f7", weight: "600" });
  text(`${levelName(L)}${extra() ? " +" + extra() : ""} · ${L.volt.toFixed(1)} V`, x0, by + 32, { size: 10, align: "left", font: FONT_M, color: L.color, weight: "600" });

  // potenciadores activos
  let px = x0;
  const py = by + 44;
  const pills = [];
  if (fx.fec > 0) pills.push(["fec", fx.fec / POWER.fec.dur]);
  if (fx.slow > 0) pills.push(["slow", fx.slow / POWER.slow.dur]);
  if (fx.shield) pills.push(["sei", 1]);
  for (const [k, f] of pills) {
    const P = POWER[k];
    ctx.fillStyle = "rgba(0,0,0,0.35)"; rr(px, py, 46, 18, 9); ctx.fill();
    ctx.fillStyle = P.color; rr(px, py, 46 * f, 18, 9); ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = P.color; ctx.lineWidth = 1; rr(px, py, 46, 18, 9); ctx.stroke();
    text(P.label, px + 23, py + 12.5, { size: 9, color: P.color });
    px += 52;
  }

  // indicador de campo
  const fy = H - CASING - 36, fxp = ELECTRODE + 22;
  ctx.strokeStyle = "rgba(232,241,247,0.6)"; ctx.fillStyle = "rgba(232,241,247,0.6)"; ctx.lineWidth = 2;
  const d = dir();
  ctx.beginPath(); ctx.moveTo(fxp, fy - 10 * d); ctx.lineTo(fxp, fy + 10 * d); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fxp - 5, fy + 5 * d); ctx.lineTo(fxp, fy + 12 * d); ctx.lineTo(fxp + 5, fy + 5 * d); ctx.fill();
  text(t("field"), fxp + 10, fy + 4, { size: 9, align: "left", font: FONT_M, color: "rgba(232,241,247,0.6)", weight: "600" });

  if (mode === "daily") text(t("dailyTag", { date: fmtDate(todayUTC()) }), W / 2, H - CASING - 10, { size: 9, font: FONT_M, color: "#f2b544", weight: "600" });

  if (banner) {
    ctx.globalAlpha = clamp(banner.t, 0, 1);
    ctx.fillStyle = "rgba(5,12,20,0.6)"; rr(ELECTRODE + 20, H * 0.34 - 30, W - (ELECTRODE + 20) * 2, 56, 10); ctx.fill();
    text(banner.title, W / 2, H * 0.34 - 4, { size: 18, color: "#f2b544" });
    text(banner.sub, W / 2, H * 0.34 + 16, { size: 10, font: FONT_M, color: "#e8f1f7", weight: "500" });
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBackground();
  drawBubbles();
  drawDendrites();
  drawMembranes();
  drawItems();
  drawParticles();
  if (state !== "dead" || time - deadAt < 2) drawIon();
  drawElectrodes();
  drawCasing();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
  if (fx.slow > 0 && state === "play") { ctx.fillStyle = "rgba(255,224,102,0.05)"; ctx.fillRect(0, 0, W, H); }
  if (state === "play" || state === "paused") drawHUD();
}

function loop(ts) {
  if (!last) last = ts;
  const dt = Math.min((ts - last) / 1000, 1 / 30);
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------------- Pantallas (overlay) ----------------
const ICONS = {
  pause: '<svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>',
  play: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 3l12 7-12 7z"/></svg>',
  sound: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h3l4-4v12l-4-4H3z" fill="currentColor" stroke="none"/><path d="M13 7a4 4 0 010 6M15.5 4.5a7.5 7.5 0 010 11"/></svg>',
  mute: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h3l4-4v12l-4-4H3z" fill="currentColor" stroke="none"/><path d="M13 7l5 6M18 7l-5 6"/></svg>',
};

function updateChrome() {
  document.documentElement.lang = lang;
  langSel.value = lang;
  document.getElementById("subtitle").textContent = t("subtitle");
  document.getElementById("help").innerHTML = t("help");
  btnPause.hidden = !(state === "play" || state === "paused");
  btnPause.innerHTML = state === "paused" ? ICONS.play : ICONS.pause;
  btnPause.setAttribute("aria-label", state === "paused" ? t("resume") : t("pause"));
  btnMute.innerHTML = audio.muted ? ICONS.mute : ICONS.sound;
}

function medalFor(p) {
  const m = t("medals");
  if (p >= 80) return { name: m.platinum, color: "#cfe8ff" };
  if (p >= 40) return { name: m.gold, color: "#f2c14e" };
  if (p >= 20) return { name: m.silver, color: "#c3ccd6" };
  if (p >= 10) return { name: m.bronze, color: "#d08a4f" };
  return null;
}

function routeHTML() {
  return LEVELS.map((L, i) => `<span class="chip${i <= maxLevel ? " on" : ""}" style="color:${L.color}">${esc(levelName(L))}</span>`).join('<span class="arrow">→</span>');
}

function menuHTML() {
  const db = dailyBest();
  return `
    <div class="logo"><span>FLAPPY</span><b>Li⁺</b></div>
    <p class="tag">${esc(t("tagline"))}</p>
    <div class="stack">
      <button class="btn primary" data-a="play">${esc(t("play"))}</button>
      <button class="btn" data-a="daily">${esc(t("daily"))}<small>${esc(t("dailySub", { date: fmtDate(todayUTC()) }))}${db ? " · " + esc(t("dailyBest")) + ": " + db : ""}</small></button>
    </div>
    <div class="row">
      <button class="btn small" data-a="games">${esc(t("myGames"))}</button>
      <button class="btn small" data-a="howto">${esc(t("howto"))}</button>
      <button class="btn small" data-a="science">${esc(t("science"))}</button>
    </div>
    <label class="toggle"><input type="checkbox" id="teacher"${teacher ? " checked" : ""}><span>${esc(t("teacher"))}<small>${esc(t("teacherHint"))}</small></span></label>
    <div class="route">${routeHTML()}</div>
    ${record > 0 ? `<p class="rec">${esc(t("record"))}: ${record}</p>` : ""}`;
}

function overHTML() {
  const r = lastRun;
  const causeKey = { membrane: "causeMembrane", dendrite: "causeDendrite", casing: "causeCasing" }[r.cause];
  const medal = medalFor(r.pores);
  const best = r.mode === "daily" ? dailyBest() : record;
  const phaseName = r.phase === "discharge" ? t("discharge") : t("charge");
  return `
    <h2 style="color:var(--ion)">${esc(t(causeKey))}</h2>
    <p class="muted">${r.mode === "daily" ? esc(t("daily")) + " " + fmtDate(r.date) + " · " : ""}${esc(t("levelN", { n: r.levelIdx + 1 }))} · ${esc(levelName(r.level))} · ${esc(phaseName)}</p>
    <div class="scores"><div><b>${r.score}</b><span>${esc(t("energy"))}</span></div><div><b class="gold">${best}</b><span>${esc(r.mode === "daily" ? t("dailyBest").toUpperCase() : t("best"))}</span></div></div>
    ${r.isNew || medal ? `<div class="badges">${r.isNew ? `<span class="badge">${esc(t("newRecord"))}</span>` : ""}${medal ? `<span class="badge medal" style="color:${medal.color}">${esc(t("medal", { m: medal.name }))}</span>` : ""}</div>` : ""}
    <p class="stats">${r.pores} ${esc(t("pores"))} · ${r.cycles} ${esc(t("cycles"))} · ${r.collected} ${esc(t("electrons"))}</p>
    <div class="fact"><h3>${esc(t("didYouKnow"))}</h3><p>${esc(FACTS[currentFact][lang])}</p></div>
    <button class="btn primary" data-a="retry">${esc(t("retry"))}</button>
    <div class="row">
      <button class="btn small" data-a="share">${esc(t("share"))}</button>
      <button class="btn small" data-a="image">${esc(t("image"))}</button>
      <button class="btn small" data-a="science">${esc(t("seeScience"))}</button>
    </div>
    <div class="row">
      <button class="btn small" data-a="games">${esc(t("myGames"))}</button>
      <button class="btn small" data-a="menu">${esc(t("menu"))}</button>
    </div>
    <p class="hint">${esc(t("spaceRetry"))}</p>`;
}

function howtoHTML() {
  const icon = (k) => {
    if (k === "pore") return '<span class="ico" style="background:#f2b544;border-radius:4px">PE</span>';
    if (k === "e") return '<span class="ico" style="background:#7fe3ff">e⁻</span>';
    if (POWER[k]) return `<span class="ico hex" style="background:${POWER[k].color}">${POWER[k].label}</span>`;
    if (k === "dendrite") return '<span class="ico" style="background:#c9d3dc;clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0"></span>';
    if (k === "bubble") return '<span class="ico" style="background:transparent;border:1.5px solid #dcf0ff;color:#dcf0ff">CO₂</span>';
    return '<span class="ico" style="background:#ff8a5c;border-radius:4px">SEI</span>';
  };
  return `
    <h2>${esc(t("howtoTitle"))}</h2>
    <p>${esc(t("howtoControls"))}</p>
    <p class="muted">${esc(t("howtoPhases"))}</p>
    <div class="legend">${t("legend").map(([k, s]) => `${icon(k)}<span>${esc(s)}</span>`).join("")}</div>
    <p class="muted">${esc(t("medalsLine"))}</p>
    <button class="btn" data-a="back">${esc(t("back"))}</button>`;
}

function gamesHTML() {
  const db = dailyBest();
  const maxS = Math.max(10, ...history);
  const rows = history.map((v, i) => `<li${i === 0 ? ' class="me"' : ""}><span>${i + 1}</span><b><i class="bar" style="width:${Math.max(2, (v / maxS) * 100)}%"></i></b><em>${v}</em></li>`).join("");
  return `
    <h2>${esc(t("myGames"))}</h2>
    <div class="scores"><div><b class="gold">${record}</b><span>${esc(t("best"))}</span></div><div><b>${db}</b><span>${esc(t("dailyBest").toUpperCase())}</span></div></div>
    <h3>${esc(t("lastGames"))}</h3>
    ${history.length ? `<ol class="rank">${rows}</ol>` : `<p class="muted">${esc(t("localEmpty"))}</p>`}
    <p class="muted">${esc(t("localNote"))}</p>
    <button class="btn" data-a="back">${esc(t("back"))}</button>`;
}

function diagramSVG(L) {
  const solid = !!L.solid;
  const layers = Array.from({ length: 15 }, (_, i) => `<line x1="20" x2="86" y1="${46 + i * 9}" y2="${46 + i * 9}" stroke="#4a525c" stroke-width="1"/>`).join("");
  const dots = Array.from({ length: 36 }, (_, i) => `<circle cx="${280 + (i % 6) * 10 + (Math.floor(i / 6) % 2) * 5}" cy="${50 + Math.floor(i / 6) * 22}" r="2.6" fill="${L.color}"/>`).join("");
  const pores = Array.from({ length: 16 }, (_, i) => `<rect x="177" y="${44 + i * 8.6}" width="6" height="3" fill="${solid ? "#e8c9a0" : "#0a1624"}"/>`).join("");
  const ionAt = (x, y) => `<circle cx="${x}" cy="${y}" r="7" fill="#ff4da6"/><text x="${x}" y="${y + 2.6}" font-size="6.5" fill="#fff" text-anchor="middle" font-weight="700">Li⁺</text>`;
  return `<svg class="diagram" viewBox="0 0 360 250" role="img" aria-label="${esc(t("sciTitle"))}" font-family="IBM Plex Mono, monospace">
    <path d="M14 40 V14 H346 V40" fill="none" stroke="#7fe3ff" stroke-width="1.5"/>
    <rect x="148" y="6" width="64" height="16" rx="4" fill="#0d1a28" stroke="#7fe3ff"/>
    <text x="180" y="17.5" font-size="8" fill="#7fe3ff" text-anchor="middle">${esc(t("sciCircuit"))}</text>
    <rect x="88" y="40" width="184" height="150" fill="${solid ? "#2a2320" : "rgba(58,123,213,0.14)"}"/>
    <rect x="10" y="40" width="8" height="150" fill="#c47a4a"/>
    <rect x="18" y="40" width="70" height="150" fill="${solid ? "#8d99a6" : "#2b2f35"}"/>
    ${solid ? "" : layers}
    <rect x="176" y="40" width="8" height="150" fill="#f2b544" opacity="0.85"/>
    ${pores}
    <rect x="272" y="40" width="70" height="150" fill="${L.dark}"/>
    ${dots}
    <rect x="342" y="40" width="8" height="150" fill="#aeb8c2"/>
    <text x="14" y="36" font-size="8" fill="#e8f1f7" text-anchor="middle">Cu</text>
    <text x="346" y="36" font-size="8" fill="#e8f1f7" text-anchor="middle">Al</text>
    <line x1="60" y1="84" x2="300" y2="84" stroke="#ff4da6" stroke-width="1.5" marker-end="url(#ah)"/>
    ${ionAt(130, 84)}
    <text x="232" y="78" font-size="8.5" fill="#ff4da6" text-anchor="middle">${esc(t("sciDischarge"))} →</text>
    <line x1="300" y1="146" x2="60" y2="146" stroke="#ffa3cf" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah2)"/>
    ${ionAt(230, 146)}
    <text x="128" y="140" font-size="8.5" fill="#ffa3cf" text-anchor="middle">← ${esc(t("sciCharge"))}</text>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff4da6"/></marker>
      <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffa3cf"/></marker>
    </defs>
    <text x="53" y="204" font-size="8.5" fill="#e8f1f7" text-anchor="middle" font-weight="600">${esc(t("sciAnode"))}</text>
    <text x="53" y="215" font-size="7.5" fill="#8aa2b8" text-anchor="middle">${esc(solid ? t("sciLiMetal") : t("sciGraphite"))} (${esc(L.anode)})</text>
    <text x="180" y="204" font-size="8.5" fill="#e8f1f7" text-anchor="middle" font-weight="600">${esc(t("sciSeparator"))} · ${esc(t("sciElectrolyte"))}</text>
    <text x="180" y="215" font-size="7.5" fill="#8aa2b8" text-anchor="middle">${esc(solid ? t("sciSolid") : t("sciLiquid"))}</text>
    <text x="307" y="204" font-size="8.5" fill="#e8f1f7" text-anchor="middle" font-weight="600">${esc(t("sciCathode"))}</text>
    <text x="307" y="215" font-size="7.5" fill="${L.color}" text-anchor="middle">${esc(L.cathode)}</text>
    <text x="180" y="238" font-size="8" fill="#8aa2b8" text-anchor="middle">${esc(levelName(L))} · ${L.volt.toFixed(1)} V</text>
  </svg>`;
}

function scienceHTML() {
  const r = state === "dead" ? lastRun : null;
  const L = r ? r.level : LEVELS[Math.min(maxLevel, LEVELS.length - 1)];
  const [ra, rc] = REACTIONS[L.id];
  return `
    <h2>${esc(t("sciTitle"))}</h2>
    ${diagramSVG(L)}
    <div class="eq"><span class="muted">${esc(t("sciReactions"))}</span><span><b>${esc(t("sciAnodeR"))}:</b> ${esc(ra)}</span><span><b>${esc(t("sciCathodeR"))}:</b> ${esc(rc)}</span></div>
    <h3>${esc(t("sciRun"))}</h3>
    <p>${r ? esc(t("sciRunText", { phases: r.phases, cycles: r.cycles, pores: r.pores, level: levelName(L), volt: L.volt.toFixed(1).replace(".", lang === "es" ? "," : "."), cap: L.cap })) : esc(t("sciNoRun"))}</p>
    <div class="fact"><h3>${esc(t("didYouKnow"))}</h3><p>${esc(FACTS[r ? currentFact : L.id][lang])}</p></div>
    <h3>${esc(t("sciMapTitle"))}</h3>
    <table class="map"><thead><tr><th>${esc(t("sciGame"))}</th><th>${esc(t("sciReal"))}</th></tr></thead><tbody>
      ${t("map").map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}
    </tbody></table>
    <p class="muted">${esc(t("sciNote"))}</p>
    ${r ? `<button class="btn primary" data-a="retry">${esc(t("retry"))}</button><div class="row"><button class="btn small" data-a="over">${esc(t("back"))}</button><button class="btn small" data-a="menu">${esc(t("menu"))}</button></div>` : `<button class="btn" data-a="back">${esc(t("back"))}</button>`}`;
}

function pauseHTML() {
  return `<h2 style="text-align:center">${esc(t("pause"))}</h2>
    <button class="btn primary" data-a="resume">${esc(t("resume"))}</button>
    <button class="btn" data-a="menu">${esc(t("menu"))}</button>`;
}

function render() {
  updateChrome();
  overlay.classList.remove("center", "late");
  if (state === "play") { overlay.hidden = true; overlay.innerHTML = ""; return; }
  overlay.hidden = false;
  let html = "";
  if (state === "paused") { html = pauseHTML(); overlay.classList.add("center"); }
  else if (ui === "howto") html = howtoHTML();
  else if (ui === "games") html = gamesHTML();
  else if (ui === "science") html = scienceHTML();
  else if (state === "dead") html = overHTML();
  else { html = menuHTML(); overlay.classList.add("center"); }
  overlay.innerHTML = html;
  overlay.scrollTop = 0;
}

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2600);
}

// ---------------- Compartir ----------------
function shareURL() { return /^https?:$/.test(location.protocol) && /github\.io$/.test(location.hostname) ? location.origin + location.pathname : CONFIG.GAME_URL; }
function shareText() {
  const r = lastRun;
  return r.mode === "daily"
    ? t("shareDaily", { date: fmtDate(r.date), score: r.score })
    : t("shareText", { score: r.score, level: levelName(r.level), cycles: r.cycles });
}
function shareCard() {
  const r = lastRun, c = document.createElement("canvas");
  c.width = 1200; c.height = 630;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 630); g.addColorStop(0, r.level.bg[0]); g.addColorStop(1, r.level.bg[1]);
  x.fillStyle = g; x.fillRect(0, 0, 1200, 630);
  x.fillStyle = "rgba(242,181,68,0.18)"; x.fillRect(760, 0, 90, 230); x.fillRect(760, 400, 90, 230);
  x.fillStyle = "#f2b544"; x.fillRect(752, 222, 106, 12); x.fillRect(752, 396, 106, 12);
  const ig = x.createRadialGradient(990, 315, 30, 990, 315, 160); ig.addColorStop(0, "rgba(255,77,166,0.6)"); ig.addColorStop(1, "rgba(255,77,166,0)");
  x.fillStyle = ig; x.beginPath(); x.arc(990, 315, 160, 0, 7); x.fill();
  x.fillStyle = "#ff4da6"; x.beginPath(); x.arc(990, 315, 80, 0, 7); x.fill();
  x.fillStyle = "#fff"; x.font = `900 64px ${FONT_D}`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("Li⁺", 990, 318);
  x.textAlign = "left"; x.textBaseline = "alphabetic";
  x.fillStyle = "#e8f1f7"; x.font = `900 52px ${FONT_D}`; x.fillText("FLAPPY Li⁺", 70, 110);
  x.fillStyle = "#8aa2b8"; x.font = `600 26px ${FONT_M}`; x.fillText(t("energy"), 72, 220);
  x.fillStyle = "#e8f1f7"; x.font = `900 150px ${FONT_D}`; x.fillText(String(r.score), 64, 360);
  x.fillStyle = r.level.color; x.font = `600 32px ${FONT_M}`;
  x.fillText(`${levelName(r.level)} · ${r.cycles} ${t("cycles")} · ${r.pores} ${t("pores")}`, 72, 430);
  if (r.mode === "daily") { x.fillStyle = "#f2b544"; x.fillText(`${t("daily")} ${fmtDate(r.date)}`, 72, 480); }
  x.fillStyle = "#8aa2b8"; x.font = `500 26px ${FONT_M}`; x.fillText(shareURL().replace(/^https?:\/\//, ""), 72, 570);
  return c;
}
async function doShare() {
  const text = shareText(), url = shareURL();
  if (navigator.share) {
    try {
      const data = { title: "Flappy Li⁺", text, url };
      try {
        const blob = await new Promise((res) => shareCard().toBlob(res, "image/png"));
        const file = new File([blob], "flappy-li.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file];
      } catch { /* sin imagen */ }
      await navigator.share(data);
      return;
    } catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast(t("copied")); }
  catch { toast(`${text} ${url}`); }
}
function doImage() {
  const a = document.createElement("a");
  a.href = shareCard().toDataURL("image/png");
  a.download = `flappy-li-${lastRun.score}.png`;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------------- Entrada ----------------
function goMenu() { state = "menu"; ui = "menu"; reset(); render(); }
function retry() { startGame(lastRun ? lastRun.mode : "normal"); }
function togglePause() {
  if (state === "play") { state = "paused"; render(); }
  else if (state === "paused") { state = "play"; last = 0; render(); }
}

overlay.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  audio.ensure();
  const a = b.dataset.a;
  if (a === "play") startGame("normal");
  else if (a === "daily") startGame("daily");
  else if (a === "retry") retry();
  else if (a === "menu") goMenu();
  else if (a === "resume") togglePause();
  else if (a === "howto" || a === "games" || a === "science") { ui = a; render(); }
  else if (a === "over") { ui = "over"; render(); }
  else if (a === "back") { ui = state === "dead" ? "over" : "menu"; render(); }
  else if (a === "share") doShare();
  else if (a === "image") doImage();
});
overlay.addEventListener("change", (e) => {
  if (e.target.id === "teacher") { teacher = e.target.checked; store(KEYS.teacher, teacher); }
});

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  audio.ensure();
  if (state === "play" && trans <= 0) flap();
});
btnPause.addEventListener("click", () => { togglePause(); btnPause.blur(); });
btnMute.addEventListener("click", () => { audio.ensure(); audio.toggle(); updateChrome(); btnMute.blur(); });
langSel.addEventListener("change", () => { lang = langSel.value; store(KEYS.lang, lang); render(); });

window.addEventListener("keydown", (e) => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  const isFlapKey = ["Space", "ArrowUp", "KeyW", "Enter"].includes(e.code);
  if (tag === "BUTTON" && (e.code === "Space" || e.code === "Enter")) return;
  if (isFlapKey) {
    e.preventDefault();
    if (e.repeat) return;
    audio.ensure();
    if (state === "play") { if (trans <= 0) flap(); }
    else if (state === "paused") togglePause();
    else if (state === "menu" && ui === "menu") startGame("normal");
    else if (state === "dead" && time - deadAt > 0.6) retry();
  } else if (e.code === "KeyP") togglePause();
  else if (e.code === "Escape") {
    if (state === "play" || state === "paused") togglePause();
    else if (ui !== "menu" && ui !== "over") { ui = state === "dead" ? "over" : "menu"; render(); }
  } else if (e.code === "KeyM") { audio.ensure(); audio.toggle(); updateChrome(); }
});
const autoPause = () => { if (state === "play") { state = "paused"; render(); } };
window.addEventListener("blur", autoPause);
document.addEventListener("visibilitychange", () => { if (document.hidden) autoPause(); last = 0; });
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(`700 16px ${FONT_D}`), document.fonts.load(`600 16px ${FONT_M}`)]).catch(() => {});
}

render();
requestAnimationFrame(loop);
})();
</script>
