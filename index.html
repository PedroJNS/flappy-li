<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1624">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230a1624%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2220%22 fill=%22%23ff4da6%22/%3E%3C/svg%3E">
<title>Flappy Li⁺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #060d16;
  --ink: #e8f1f7;
  --dim: #8aa2b8;
  --ion: #ff4da6;
  --line: #1c2a38;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  overscroll-behavior: none;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
}
.bar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; justify-content: center; }
.bar h1 { font-family: "Orbitron", "Segoe UI", Arial, sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 0.06em; margin: 0; }
.bar .li { color: var(--ion); }
.bar p { margin: 0; font-size: 12px; color: var(--dim); }
.stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
canvas {
  display: block;
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: 0 20px 60px -20px rgba(255, 77, 166, 0.25);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.help { margin: 0; font-size: 12px; color: var(--dim); text-align: center; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink); font: inherit; }
</style>
</head>
<body>

<main class="app">
  <header class="bar">
    <h1>Flappy <span class="li">Li⁺</span></h1>
    <p>Celda de ion-litio · electrolito LiPF₆</p>
  </header>
  <div class="stage"><canvas id="game" aria-label="Juego Flappy Li⁺"></canvas></div>
  <p class="help"><kbd>Espacio</kbd> o toque para impulsar · <kbd>P</kbd> pausa · <kbd>M</kbd> sonido</p>
</main>
<script>
// Flappy Li⁺ — motor del juego (JavaScript puro, sin dependencias).
// Todo el estado vive aquí, fuera de React, para que el bucle no se reinicie
// con cada cambio de puntuación.

const W = 400;
const H = 600;
const CASING = 22; // carcasa superior e inferior
const ELECTRODE = 16; // franjas de ánodo/cátodo en los bordes
const ION_X = 110;
const ION_R = 14;
const HIT_R = ION_R * 0.82; // hitbox algo más pequeña que el dibujo: más justo
const G = 1500;
const JUMP = -430;
const MAX_FALL = 620;
const MEM_W = 58;
const SPACING = 235; // distancia horizontal entre membranas
const MEMBRANES_PER_CYCLE = 10;

const KEYS = {
  scores: "flappyLiScores",
  record: "flappyLiRecord",
  muted: "flappyLiMuted",
};

const C = {
  electrolyte0: "#0a1624",
  electrolyte1: "#10263a",
  casing: "#1b232c",
  casingLine: "#2c3844",
  anode: "#2b2f35",
  anodeLine: "#4a525c",
  cathode: "#1f4f8a",
  cathodeLine: "#3a7bd5",
  membrane: "rgba(242, 181, 68, 0.20)",
  membraneEdge: "#f2b544",
  ion: "#ff4da6",
  ionLight: "#ffa3cf",
  electron: "#7fe3ff",
  anion: "rgba(120, 170, 220, 0.35)",
  text: "#e8f1f7",
  textDim: "#8aa2b8",
  panel: "rgba(8, 18, 30, 0.88)",
  gold: "#f2b544",
};

const FONT_DISPLAY = "'Orbitron', 'Segoe UI', Arial, sans-serif";
const FONT_MONO = "'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace";

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v == null ? fallback : JSON.parse(v);
  } catch {
    return fallback;
  }
}
function store(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {
    /* almacenamiento no disponible: se juega igual */
  }
}

function makeAudio() {
  let ac = null;
  let muted = !!load(KEYS.muted, false);
  const ensure = () => {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ac = new AC();
      }
      if (ac && ac.state === "suspended") ac.resume();
    } catch {
      ac = null;
    }
  };
  const tone = (freq, dur, type = "sine", vol = 0.12, slideTo = null, delay = 0) => {
    if (muted || !ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  };
  return {
    ensure,
    get muted() {
      return muted;
    },
    toggle() {
      muted = !muted;
      store(KEYS.muted, muted);
    },
    flap: () => tone(380, 0.11, "triangle", 0.1, 720),
    score: () => {
      tone(660, 0.07, "sine", 0.1);
      tone(990, 0.1, "sine", 0.1, null, 0.06);
    },
    cycle: () => {
      tone(523, 0.1, "triangle", 0.12);
      tone(659, 0.1, "triangle", 0.12, null, 0.09);
      tone(784, 0.18, "triangle", 0.12, null, 0.18);
    },
    electron: () => tone(1320, 0.07, "square", 0.05, 1900),
    die: () => {
      tone(320, 0.5, "sawtooth", 0.12, 55);
      tone(90, 0.35, "square", 0.06, 40, 0.05);
    },
  };
}

function medalFor(membranes) {
  if (membranes >= 80) return { name: "Platino", color: "#cfe8ff" };
  if (membranes >= 40) return { name: "Oro", color: "#f2c14e" };
  if (membranes >= 20) return { name: "Plata", color: "#c3ccd6" };
  if (membranes >= 10) return { name: "Bronce", color: "#d08a4f" };
  return null;
}

function createGame(canvas) {
  const ctx = canvas.getContext("2d");
  const audio = makeAudio();

  let scale = 1;
  let dpr = 1;
  let state = "menu"; // menu | play | paused | dead
  let time = 0;
  let deadAt = 0;
  let rafId = 0;
  let last = 0;

  let ion, mems, electrons, particles, speed, score, passed, collected;
  let shake = 0;
  let flash = 0;
  let lastGapY = H / 2;
  let spawnDist = 0;
  let cycleBanner = 0;
  let newRecord = false;

  let record = Number(load(KEYS.record, 0)) || 0;
  let history = load(KEYS.scores, []);
  if (!Array.isArray(history)) history = [];

  // Aniones PF6⁻ del electrolito (fondo con paralaje)
  const anions = Array.from({ length: 22 }, () => ({
    x: rand(0, W),
    y: rand(CASING + 10, H - CASING - 10),
    r: rand(3, 7),
    depth: rand(0.15, 0.5),
  }));

  // Textura de poros de la membrana separadora (PE/PP)
  const poreTile = document.createElement("canvas");
  poreTile.width = 12;
  poreTile.height = 12;
  {
    const p = poreTile.getContext("2d");
    p.fillStyle = "rgba(242,181,68,0.35)";
    p.beginPath();
    p.arc(3, 3, 1.3, 0, Math.PI * 2);
    p.arc(9, 9, 1.3, 0, Math.PI * 2);
    p.fill();
  }
  const porePattern = ctx.createPattern(poreTile, "repeat");

  function reset() {
    ion = { y: H / 2, vy: 0, squash: 0 };
    mems = [];
    electrons = [];
    particles = [];
    speed = 150;
    score = 0;
    passed = 0;
    collected = 0;
    shake = 0;
    flash = 0;
    lastGapY = H / 2;
    spawnDist = SPACING - 90;
    cycleBanner = 0;
    newRecord = false;
  }
  reset();

  // ---------- Tamaño y escalado (nítido en pantallas retina) ----------
  function resize() {
    const parent = canvas.parentElement;
    if (!parent) return;
    const availW = parent.clientWidth;
    const availH = parent.clientHeight || window.innerHeight;
    scale = Math.max(0.4, Math.min(availW / W, availH / H));
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = `${Math.floor(W * scale)}px`;
    canvas.style.height = `${Math.floor(H * scale)}px`;
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
  }
  const ro = new ResizeObserver(resize);
  if (canvas.parentElement) ro.observe(canvas.parentElement);
  resize();

  // ---------- Lógica ----------
  function spawn() {
    const gap = Math.max(128, 176 - passed * 1.3);
    const minC = CASING + gap / 2 + 24;
    const maxC = H - CASING - gap / 2 - 24;
    // El hueco nuevo no se aleja demasiado del anterior: siempre es alcanzable
    const c = clamp(lastGapY + rand(-170, 170), minC, maxC);
    lastGapY = c;
    const moving = passed >= 12 && Math.random() < Math.min(0.55, (passed - 11) * 0.04);
    mems.push({
      x: W,
      c,
      base: c,
      gap,
      minC,
      maxC,
      moving,
      amp: moving ? rand(28, 55) : 0,
      phase: rand(0, Math.PI * 2),
      counted: false,
    });
    if (Math.random() < 0.5) {
      electrons.push({
        x: W + MEM_W + SPACING / 2 - 10,
        y: clamp(c + rand(-70, 70), CASING + 30, H - CASING - 30),
        bob: rand(0, Math.PI * 2),
      });
    }
  }

  function burst(x, y, n, color, spd = 180) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(spd * 0.3, spd);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), max: 0.9, r: rand(1.5, 3.5), color });
    }
  }

  function flap() {
    ion.vy = JUMP;
    ion.squash = 1;
    audio.flap();
  }

  function start() {
    reset();
    state = "play";
    flap();
  }

  function die() {
    if (state !== "play") return;
    state = "dead";
    deadAt = time;
    shake = 14;
    flash = 1;
    burst(ION_X, ion.y, 36, C.ion, 260);
    audio.die();
    history.unshift(score);
    if (history.length > 10) history.length = 10;
    store(KEYS.scores, history);
    if (score > record) {
      record = score;
      newRecord = score > 0;
      store(KEYS.record, record);
    }
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx;
    const dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function update(dt) {
    time += dt;
    const drift = state === "play" ? speed : 45;
    if (state !== "paused") {
      for (const a of anions) {
        a.x -= drift * a.depth * dt;
        if (a.x < -10) {
          a.x = W + 10;
          a.y = rand(CASING + 10, H - CASING - 10);
        }
      }
    }

    // partículas (siguen animándose tras morir)
    if (state !== "paused") {
      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 300 * dt;
        p.life -= dt;
      }
      particles = particles.filter((p) => p.life > 0);
      shake = Math.max(0, shake - 40 * dt);
      flash = Math.max(0, flash - 2.5 * dt);
      cycleBanner = Math.max(0, cycleBanner - dt);
    }

    if (state === "menu") {
      ion.y = H / 2 - 42 + Math.sin(time * 2.4) * 10;
      return;
    }
    if (state === "dead") {
      // el ion cae al fondo tras el impacto
      if (ion.y + ION_R < H - CASING) {
        ion.vy = Math.min(ion.vy + G * dt, MAX_FALL);
        ion.y = Math.min(ion.y + ion.vy * dt, H - CASING - ION_R);
      }
      return;
    }
    if (state !== "play") return;

    ion.vy = Math.min(ion.vy + G * dt, MAX_FALL);
    ion.y += ion.vy * dt;
    ion.squash = Math.max(0, ion.squash - 5 * dt);

    // estela
    if (Math.random() < 0.8) {
      particles.push({ x: ION_X - ION_R * 0.6, y: ion.y + rand(-4, 4), vx: -speed * 0.6, vy: rand(-15, 15), life: 0.35, max: 0.35, r: rand(1.5, 3), color: C.ionLight, noGrav: true });
    }

    spawnDist += speed * dt;
    if (spawnDist >= SPACING) {
      spawnDist -= SPACING;
      spawn();
    }

    for (const m of mems) {
      m.x -= speed * dt;
      if (m.moving) m.c = clamp(m.base + Math.sin(time * 1.7 + m.phase) * m.amp, m.minC, m.maxC);
    }
    while (mems.length && mems[0].x + MEM_W < -10) mems.shift();

    for (const e of electrons) e.x -= speed * dt;
    electrons = electrons.filter((e) => !e.taken && e.x > -20);

    if (ion.y - HIT_R < CASING || ion.y + HIT_R > H - CASING) {
      ion.y = clamp(ion.y, CASING + ION_R, H - CASING - ION_R);
      die();
      return;
    }

    for (const m of mems) {
      const top = m.c - m.gap / 2;
      const bot = m.c + m.gap / 2;
      if (
        circleRect(ION_X, ion.y, HIT_R, m.x, 0, MEM_W, top) ||
        circleRect(ION_X, ion.y, HIT_R, m.x, bot, MEM_W, H - bot)
      ) {
        die();
        return;
      }
      if (!m.counted && m.x + MEM_W < ION_X - ION_R) {
        m.counted = true;
        passed++;
        score += 10;
        speed = Math.min(speed + 3.5, 275);
        if (passed % MEMBRANES_PER_CYCLE === 0) {
          cycleBanner = 1.6;
          audio.cycle();
          burst(ION_X, ion.y, 20, C.gold, 200);
        } else {
          audio.score();
        }
      }
    }

    for (const e of electrons) {
      const y = e.y + Math.sin(time * 4 + e.bob) * 6;
      const dx = e.x - ION_X;
      const dy = y - ion.y;
      if (dx * dx + dy * dy < (ION_R + 10) ** 2) {
        e.taken = true;
        score += 5;
        collected++;
        audio.electron();
        burst(e.x, y, 10, C.electron, 140);
      }
    }
  }

  // ---------- Dibujo ----------
  function text(str, x, y, { size = 16, font = FONT_DISPLAY, color = C.text, align = "center", weight = "700", base = "alphabetic" } = {}) {
    ctx.font = `${weight} ${size}px ${font}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = base;
    ctx.fillText(str, x, y);
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, C.electrolyte1);
    g.addColorStop(1, C.electrolyte0);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = C.anion;
    ctx.lineWidth = 1.2;
    for (const a of anions) {
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(a.x - a.r * 0.45, a.y);
      ctx.lineTo(a.x + a.r * 0.45, a.y);
      ctx.stroke();
    }
  }

  function drawCasing() {
    for (const [y0, h] of [[0, CASING], [H - CASING, CASING]]) {
      ctx.fillStyle = C.casing;
      ctx.fillRect(0, y0, W, h);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, y0, W, h);
      ctx.clip();
      ctx.strokeStyle = C.casingLine;
      ctx.lineWidth = 2;
      const off = state === "play" ? (time * speed) % 14 : (time * 45) % 14;
      for (let x = -h - off; x < W + h; x += 14) {
        ctx.beginPath();
        ctx.moveTo(x, y0 + h);
        ctx.lineTo(x + h, y0);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.fillRect(0, CASING - 1, W, 1);
    ctx.fillRect(0, H - CASING, W, 1);
  }

  function drawElectrodes() {
    // Ánodo de grafito (capas) a la izquierda
    ctx.fillStyle = C.anode;
    ctx.fillRect(0, CASING, ELECTRODE, H - CASING * 2);
    ctx.strokeStyle = C.anodeLine;
    ctx.lineWidth = 1;
    for (let y = CASING + 4; y < H - CASING; y += 6) {
      ctx.beginPath();
      ctx.moveTo(2, y);
      ctx.lineTo(ELECTRODE - 2, y);
      ctx.stroke();
    }
    // Cátodo de LiCoO₂ a la derecha
    ctx.fillStyle = C.cathode;
    ctx.fillRect(W - ELECTRODE, CASING, ELECTRODE, H - CASING * 2);
    ctx.fillStyle = C.cathodeLine;
    for (let y = CASING + 5; y < H - CASING; y += 9) {
      ctx.beginPath();
      ctx.arc(W - ELECTRODE / 2, y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(ELECTRODE / 2 + 0.5, H / 2);
    ctx.rotate(-Math.PI / 2);
    text("ÁNODO · C₆", 0, 0, { size: 9, color: "#cfd6de", base: "middle", font: FONT_MONO, weight: "600" });
    ctx.restore();
    ctx.save();
    ctx.translate(W - ELECTRODE / 2 - 0.5, H / 2);
    ctx.rotate(Math.PI / 2);
    text("CÁTODO · LiCoO₂", 0, 0, { size: 9, color: "#dbe9ff", base: "middle", font: FONT_MONO, weight: "600" });
    ctx.restore();
  }

  function drawMembranes() {
    for (const m of mems) {
      const top = m.c - m.gap / 2;
      const bot = m.c + m.gap / 2;
      for (const [y, h, lipY] of [[CASING - 4, top - CASING + 4, top], [bot, H - CASING - bot + 4, bot]]) {
        ctx.fillStyle = C.membrane;
        rr(m.x, y, MEM_W, h, 6);
        ctx.fill();
        ctx.save();
        ctx.translate(m.x, 0);
        ctx.fillStyle = porePattern;
        rr(0, y, MEM_W, h, 6);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = m.moving ? "#ff8a5c" : "rgba(242,181,68,0.7)";
        ctx.lineWidth = 1.5;
        rr(m.x + 0.75, y + 0.75, MEM_W - 1.5, h - 1.5, 6);
        ctx.stroke();
        // labio del poro
        ctx.fillStyle = m.moving ? "#ff8a5c" : C.membraneEdge;
        rr(m.x - 3, lipY - 4, MEM_W + 6, 8, 4);
        ctx.fill();
      }
      text(m.moving ? "SEI" : "PE", m.x + MEM_W / 2, top - 14, { size: 10, font: FONT_MONO, color: m.moving ? "#ffb190" : "rgba(242,181,68,0.85)", weight: "600" });
    }
  }

  function drawElectrons() {
    for (const e of electrons) {
      const y = e.y + Math.sin(time * 4 + e.bob) * 6;
      const g = ctx.createRadialGradient(e.x, y, 2, e.x, y, 14);
      g.addColorStop(0, "rgba(127,227,255,0.55)");
      g.addColorStop(1, "rgba(127,227,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(e.x, y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.electron;
      ctx.beginPath();
      ctx.arc(e.x, y, 7, 0, Math.PI * 2);
      ctx.fill();
      text("e⁻", e.x, y + 0.5, { size: 9, color: "#06202b", base: "middle", font: FONT_MONO });
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawIon() {
    const x = ION_X;
    const y = ion.y;
    const tilt = state === "play" || state === "dead" ? clamp(ion.vy / 900, -0.45, 0.8) : 0;
    const sq = ion.squash * 0.18;

    const halo = ctx.createRadialGradient(x, y, ION_R * 0.8, x, y, ION_R * 2.2);
    halo.addColorStop(0, "rgba(255,77,166,0.55)");
    halo.addColorStop(1, "rgba(255,77,166,0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x, y, ION_R * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.scale(1 - sq, 1 + sq);
    const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, ION_R);
    g.addColorStop(0, C.ionLight);
    g.addColorStop(1, C.ion);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, ION_R, 0, Math.PI * 2);
    ctx.fill();
    text("Li⁺", 0, 1, { size: 11, color: "#ffffff", base: "middle" });
    ctx.restore();
  }

  // botones del HUD (coordenadas lógicas)
  const BTN = {
    mute: { x: W - ELECTRODE - 38, y: CASING + 8, w: 30, h: 30 },
    pause: { x: W - ELECTRODE - 74, y: CASING + 8, w: 30, h: 30 },
  };

  function drawButtons() {
    for (const [k, b] of Object.entries(BTN)) {
      if (k === "pause" && state !== "play" && state !== "paused") continue;
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      rr(b.x, b.y, b.w, b.h, 8);
      ctx.fill();
      ctx.strokeStyle = C.text;
      ctx.fillStyle = C.text;
      ctx.lineWidth = 2;
      const cx = b.x + b.w / 2;
      const cy = b.y + b.h / 2;
      if (k === "pause") {
        if (state === "paused") {
          ctx.beginPath();
          ctx.moveTo(cx - 4, cy - 7);
          ctx.lineTo(cx + 7, cy);
          ctx.lineTo(cx - 4, cy + 7);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(cx - 6, cy - 7, 4, 14);
          ctx.fillRect(cx + 2, cy - 7, 4, 14);
        }
      } else {
        ctx.beginPath();
        ctx.moveTo(cx - 9, cy - 3);
        ctx.lineTo(cx - 5, cy - 3);
        ctx.lineTo(cx, cy - 8);
        ctx.lineTo(cx, cy + 8);
        ctx.lineTo(cx - 5, cy + 3);
        ctx.lineTo(cx - 9, cy + 3);
        ctx.closePath();
        ctx.fill();
        if (audio.muted) {
          ctx.beginPath();
          ctx.moveTo(cx + 3, cy - 5);
          ctx.lineTo(cx + 10, cy + 5);
          ctx.moveTo(cx + 10, cy - 5);
          ctx.lineTo(cx + 3, cy + 5);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(cx + 1, cy, 5, -0.9, 0.9);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + 1, cy, 9, -0.9, 0.9);
          ctx.stroke();
        }
      }
    }
  }

  function drawHUD() {
    const x0 = ELECTRODE + 12;
    text(String(score), x0, CASING + 38, { size: 30, align: "left" });
    text("ENERGÍA", x0 + 1, CASING + 54, { size: 9, align: "left", color: C.textDim, font: FONT_MONO, weight: "600" });

    // Batería: estado de carga del ciclo actual
    const soc = (passed % MEMBRANES_PER_CYCLE) / MEMBRANES_PER_CYCLE;
    const cycle = Math.floor(passed / MEMBRANES_PER_CYCLE) + 1;
    const bx = x0;
    const by = CASING + 64;
    ctx.strokeStyle = C.text;
    ctx.lineWidth = 1.5;
    rr(bx, by, 64, 16, 3);
    ctx.stroke();
    ctx.fillStyle = C.text;
    ctx.fillRect(bx + 64, by + 5, 3, 6);
    ctx.fillStyle = soc > 0.7 ? "#6fdc8c" : soc > 0.3 ? C.gold : C.ion;
    ctx.fillRect(bx + 3, by + 3, Math.max(0, 58 * soc), 10);
    text(`SOC ${Math.round(soc * 100)}% · ciclo ${cycle}`, bx + 74, by + 12, { size: 10, align: "left", font: FONT_MONO, color: C.textDim, weight: "600" });

    if (cycleBanner > 0) {
      ctx.globalAlpha = clamp(cycleBanner, 0, 1);
      text(`¡Ciclo ${cycle - 1} completado!`, W / 2, H * 0.32, { size: 18, color: C.gold });
      text("+100% carga", W / 2, H * 0.32 + 20, { size: 11, font: FONT_MONO, color: C.text, weight: "600" });
      ctx.globalAlpha = 1;
    }
  }

  function panel(y, h) {
    ctx.fillStyle = C.panel;
    rr(ELECTRODE + 18, y, W - (ELECTRODE + 18) * 2, h, 14);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawMenu() {
    ctx.fillStyle = "rgba(5,12,20,0.35)";
    ctx.fillRect(0, 0, W, H);
    text("FLAPPY", W / 2, 120, { size: 40 });
    text("Li⁺", W / 2, 172, { size: 48, color: C.ion });
    text("Lleva el ion de litio del ánodo al cátodo", W / 2, 204, { size: 12, font: FONT_MONO, color: C.textDim, weight: "500" });
    text("atravesando los poros del separador.", W / 2, 221, { size: 12, font: FONT_MONO, color: C.textDim, weight: "500" });

    panel(360, 170);
    const rows = [
      ["Impulsar", "Espacio · ↑ · clic · toque"],
      ["Pausa", "P · Esc"],
      ["Sonido", "M"],
      ["Poro superado", "+10"],
      ["Electrón e⁻", "+5"],
      ["Membrana SEI", "se mueve"],
    ];
    rows.forEach(([a, b], i) => {
      text(a, ELECTRODE + 36, 388 + i * 23, { size: 11, align: "left", font: FONT_MONO, color: C.textDim, weight: "500" });
      text(b, W - ELECTRODE - 36, 388 + i * 23, { size: 11, align: "right", font: FONT_MONO, weight: "600" });
    });

    const pulse = 0.55 + 0.45 * Math.sin(time * 4);
    ctx.globalAlpha = pulse;
    text("Toca o pulsa ESPACIO para empezar", W / 2, 322, { size: 13 });
    ctx.globalAlpha = 1;
    if (record > 0) text(`Récord: ${record}`, W / 2, 556, { size: 12, font: FONT_MONO, color: C.gold, weight: "600" });
  }

  function drawPaused() {
    ctx.fillStyle = "rgba(5,12,20,0.6)";
    ctx.fillRect(0, 0, W, H);
    text("PAUSA", W / 2, H / 2 - 6, { size: 30 });
    text("Toca o pulsa P para seguir", W / 2, H / 2 + 22, { size: 12, font: FONT_MONO, color: C.textDim, weight: "500" });
  }

  function drawDead() {
    const k = clamp((time - deadAt) / 0.35, 0, 1);
    ctx.fillStyle = `rgba(5,12,20,${0.55 * k})`;
    ctx.fillRect(0, 0, W, H);
    if (k < 1) return;

    panel(96, 408);
    text("ION ATRAPADO", W / 2, 140, { size: 22, color: C.ion });
    text(`${passed} poros · ${collected} e⁻`, W / 2, 162, { size: 11, font: FONT_MONO, color: C.textDim, weight: "500" });

    text(String(score), W / 2 - 70, 218, { size: 34 });
    text("ENERGÍA", W / 2 - 70, 236, { size: 9, font: FONT_MONO, color: C.textDim, weight: "600" });
    text(String(record), W / 2 + 70, 218, { size: 34, color: C.gold });
    text("RÉCORD", W / 2 + 70, 236, { size: 9, font: FONT_MONO, color: C.textDim, weight: "600" });

    if (newRecord) {
      ctx.fillStyle = C.gold;
      rr(W / 2 - 58, 250, 116, 20, 10);
      ctx.fill();
      text("¡NUEVO RÉCORD!", W / 2, 264, { size: 10, color: "#1a1204" });
    }
    const medal = medalFor(passed);
    if (medal) {
      ctx.fillStyle = medal.color;
      ctx.beginPath();
      ctx.arc(W / 2 - 46, 292, 7, 0, Math.PI * 2);
      ctx.fill();
      text(`Medalla ${medal.name}`, W / 2 - 32, 296, { size: 11, align: "left", font: FONT_MONO, weight: "600" });
    }

    // Últimas partidas como barras
    text("ÚLTIMAS 10 PARTIDAS", ELECTRODE + 40, 330, { size: 9, align: "left", font: FONT_MONO, color: C.textDim, weight: "600" });
    const maxS = Math.max(10, ...history);
    const bw = (W - (ELECTRODE + 40) * 2) / 10;
    history.forEach((s, i) => {
      const h = Math.max(2, (s / maxS) * 80);
      const x = ELECTRODE + 40 + i * bw;
      ctx.fillStyle = i === 0 ? C.ion : "rgba(232,241,247,0.35)";
      rr(x + 3, 430 - h, bw - 6, h, 3);
      ctx.fill();
      text(String(s), x + bw / 2, 446, { size: 9, font: FONT_MONO, color: i === 0 ? C.text : C.textDim, weight: "500" });
    });

    if (time - deadAt > 0.6) {
      const pulse = 0.55 + 0.45 * Math.sin(time * 4);
      ctx.globalAlpha = pulse;
      text("Toca o pulsa ESPACIO para reintentar", W / 2, 482, { size: 12 });
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
    drawBackground();
    drawMembranes();
    drawElectrons();
    drawParticles();
    if (state !== "dead" || time - deadAt < 2) drawIon();
    drawElectrodes();
    drawCasing();
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (state === "play" || state === "paused") drawHUD();
    if (state === "menu") drawMenu();
    if (state === "paused") drawPaused();
    if (state === "dead") drawDead();
    drawButtons();
  }

  function loop(t) {
    if (!last) last = t;
    const dt = Math.min((t - last) / 1000, 1 / 30);
    last = t;
    update(dt);
    draw();
    rafId = requestAnimationFrame(loop);
  }

  // ---------- Entrada ----------
  function press() {
    audio.ensure();
    if (state === "menu") start();
    else if (state === "play") flap();
    else if (state === "paused") state = "play";
    else if (state === "dead" && time - deadAt > 0.6) start();
  }
  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }
  const inBtn = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

  function onPointer(e) {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    const y = ((e.clientY - r.top) / r.height) * H;
    if (inBtn(BTN.mute, x, y)) {
      audio.ensure();
      audio.toggle();
      return;
    }
    if ((state === "play" || state === "paused") && inBtn(BTN.pause, x, y)) {
      togglePause();
      return;
    }
    press();
  }
  function onKey(e) {
    if (["Space", "ArrowUp", "KeyW", "Enter"].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) press();
    } else if (e.code === "KeyP" || e.code === "Escape") {
      togglePause();
    } else if (e.code === "KeyM") {
      audio.ensure();
      audio.toggle();
    }
  }
  function onHide() {
    if (state === "play") state = "paused";
  }
  function onVisibility() {
    if (document.hidden) onHide();
    last = 0;
  }

  canvas.addEventListener("pointerdown", onPointer);
  window.addEventListener("keydown", onKey);
  window.addEventListener("blur", onHide);
  document.addEventListener("visibilitychange", onVisibility);
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`700 16px ${FONT_DISPLAY}`).catch(() => {});
    document.fonts.load(`600 16px ${FONT_MONO}`).catch(() => {});
  }
  rafId = requestAnimationFrame(loop);

  return {
    destroy() {
      cancelAnimationFrame(rafId);
      ro.disconnect();
      canvas.removeEventListener("pointerdown", onPointer);
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("blur", onHide);
      document.removeEventListener("visibilitychange", onVisibility);
    },
  };
}
createGame(document.getElementById("game"));
</script>

</body>
</html>
